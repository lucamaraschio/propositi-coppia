<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luca & Vanessa 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F0E8;
      --card: #FEFCF8;
      --dark: #1E1510;
      --accent: #B5613A;
      --accent-light: #F2E4D8;
      --success: #5A8C6A;
      --success-light: #E0EDE4;
      --muted: #9A8470;
      --border: #E5DDD0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ── */
    header {
      background: var(--dark);
      padding: 28px 20px 22px;
      text-align: center;
    }

    header .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 400;
      color: #FDF8F0;
      line-height: 1.2;
    }

    header h1 em {
      font-style: italic;
      color: #E8C9B0;
    }

    header .subtitle {
      font-size: 12px;
      font-weight: 300;
      color: #7a6a5a;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    /* ── Progress summary ── */
    .summary {
      background: var(--dark);
      padding: 0 20px 20px;
      display: flex;
      gap: 12px;
    }

    .summary-pill {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }

    .summary-pill .num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: #FDF8F0;
      line-height: 1;
    }

    .summary-pill .label {
      font-size: 10px;
      font-weight: 300;
      color: #7a6a5a;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ── Filter tabs ── */
    .tabs-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 0;
      scrollbar-width: none;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }

    .tabs {
      display: flex;
      gap: 6px;
      width: max-content;
    }

    .tab {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--dark);
      color: #FDF8F0;
      border-color: var(--dark);
    }

    /* ── List ── */
    .list {
      padding: 14px 16px 100px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      transition: opacity 0.3s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card.is-done {
      opacity: 0.65;
    }

    .card.is-done::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--success);
      border-radius: 18px 18px 0 0;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-emoji {
      font-size: 26px;
      flex-shrink: 0;
      line-height: 1.1;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-freq {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .card-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      line-height: 1.35;
      color: var(--dark);
    }

    .card-note {
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
      margin-top: 3px;
      font-style: italic;
    }

    /* ── Timer row ── */
    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .timer-text {
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
    }

    .timer-text.urgent {
      color: #C05A3A;
    }

    /* ── Progress ── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: var(--accent-light);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-fill.done {
      background: var(--success);
    }

    .progress-count {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      min-width: 30px;
      text-align: right;
    }

    .progress-count.done {
      color: var(--success);
    }

    /* ── Buttons ── */
    .btn-complete {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: none;
      background: var(--dark);
      color: #FDF8F0;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-complete:active { transform: scale(0.98); }

    .btn-complete.done {
      background: var(--success);
    }

    .btn-complete:disabled {
      cursor: default;
    }

    .btn-undo {
      display: block;
      margin: 6px auto 0;
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 64px 20px;
    }

    .empty-emoji {
      font-size: 52px;
      margin-bottom: 14px;
    }

    .empty h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 6px;
    }

    .empty p {
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
    }

    /* ── Celebration ── */
    @keyframes celebPop {
      0%   { opacity: 1; transform: scale(1) translateY(0); }
      70%  { opacity: 1; transform: scale(1.4) translateY(-10px); }
      100% { opacity: 0; transform: scale(1.6) translateY(-20px); }
    }

    .celeb-burst {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 72px;
      pointer-events: none;
      z-index: 999;
      animation: celebPop 1.2s ease-out forwards;
    }

    /* ── Period label on summary ── */
    .period-label {
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <div class="eyebrow">Propositi di coppia · 2026</div>
  <h1>Luca <em>&</em> Vanessa</h1>
  <div class="subtitle">I vostri impegni, insieme</div>
</header>

<div class="summary" id="summary">
  <div class="summary-pill">
    <div class="num" id="sumTotal">—</div>
    <div class="label">Totali</div>
  </div>
  <div class="summary-pill">
    <div class="num" id="sumDone">—</div>
    <div class="label">Completati</div>
  </div>
  <div class="summary-pill">
    <div class="num" id="sumPending">—</div>
    <div class="label">Da fare</div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="all">Tutti</button>
    <button class="tab" data-filter="pending">Da fare</button>
    <button class="tab" data-filter="done">Completati</button>
    <button class="tab" data-filter="daily">Oggi</button>
    <button class="tab" data-filter="weekly">Settimana</button>
    <button class="tab" data-filter="monthly">Mese</button>
    <button class="tab" data-filter="long">Lungo periodo</button>
  </div>
</div>

<div class="list" id="list"></div>

<script>
// ─── Resolutions ──────────────────────────────────────────────────────────────

const RESOLUTIONS = [
  {
    id: 'r01', emoji: '💕',
    text: 'Scopare una volta a settimana',
    frequency: 'weekly', target: 1
  },
  {
    id: 'r02', emoji: '📵',
    text: 'Giornata senza telefono quando siamo a casa',
    frequency: 'monthly', target: 2,
    note: 'La domenica?'
  },
  {
    id: 'r03', emoji: '🎲',
    text: 'Provare qualcosa di nuovo insieme',
    frequency: 'bimonthly', target: 1,
    note: 'Da stilare una lista di proposte'
  },
  {
    id: 'r04', emoji: '🌄',
    text: 'Gita fuori porta insieme',
    frequency: 'monthly', target: 1
  },
  {
    id: 'r05', emoji: '💬',
    text: 'Parlarci di come stiamo e come sta andando',
    frequency: 'monthly', target: 1,
    note: 'Da fare quando facciamo il budget?'
  },
  {
    id: 'r06', emoji: '🍽️',
    text: 'Cena fuori in coppia',
    frequency: 'monthly', target: 1
  },
  {
    id: 'r07', emoji: '🌙',
    text: 'Dirci cosa ci è piaciuto e cosa no di noi stessi',
    frequency: 'daily', target: 1
  },
  {
    id: 'r08', emoji: '📺',
    text: 'Una sera senza TV né telefono',
    frequency: 'weekly', target: 1
  },
  {
    id: 'r09', emoji: '🎬',
    text: 'Andare al cinema',
    frequency: 'quarterly', target: 1
  },
  {
    id: 'r10', emoji: '💼',
    text: 'Aggiornarci su cosa stiamo facendo a lavoro in profondità',
    frequency: 'biweekly', target: 1
  },
];

const FREQ_LABEL = {
  daily:     'Ogni giorno',
  weekly:    'Ogni settimana',
  biweekly:  'Ogni 2 settimane',
  monthly:   'Ogni mese',
  bimonthly: 'Ogni 2 mesi',
  quarterly: 'Ogni 3 mesi',
};

// ─── Period helpers ───────────────────────────────────────────────────────────

function monday(d) {
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
  date.setHours(0,0,0,0);
  return date;
}

const BIWEEKLY_REF = new Date('2026-01-05'); // first Monday 2026

function getPeriodKey(freq, now = new Date()) {
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  switch (freq) {
    case 'daily':     return `d-${y}-${m}-${d}`;
    case 'weekly': {
      const mon = monday(now);
      return `w-${mon.getFullYear()}-${mon.getMonth()}-${mon.getDate()}`;
    }
    case 'biweekly': {
      const weeks = Math.floor((now - BIWEEKLY_REF) / 604800000);
      return `bw-${Math.floor(weeks / 2)}`;
    }
    case 'monthly':   return `m-${y}-${m}`;
    case 'bimonthly': return `bm-${y}-${Math.floor(m/2)}`;
    case 'quarterly': return `q-${y}-${Math.floor(m/3)}`;
  }
}

function getPeriodEnd(freq, now = new Date()) {
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  switch (freq) {
    case 'daily': {
      const e = new Date(y, m, d+1); e.setHours(0,0,0,0); return e;
    }
    case 'weekly': {
      const mon = monday(now);
      return new Date(mon.getTime() + 7*86400000);
    }
    case 'biweekly': {
      const weeks = Math.floor((now - BIWEEKLY_REF) / 604800000);
      const nextPeriod = (Math.floor(weeks/2) + 1) * 2;
      return new Date(BIWEEKLY_REF.getTime() + nextPeriod * 604800000);
    }
    case 'monthly':   return new Date(y, m+1, 1);
    case 'bimonthly': return new Date(y, (Math.floor(m/2)+1)*2, 1);
    case 'quarterly': return new Date(y, (Math.floor(m/3)+1)*3, 1);
  }
}

function formatTimeLeft(end) {
  const diff = end - Date.now();
  if (diff <= 0) return { text: 'scaduto', urgent: true };
  const days  = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins  = Math.floor((diff % 3600000) / 60000);
  if (days > 1)   return { text: `${days} giorni rimasti`, urgent: false };
  if (days === 1) return { text: `1 giorno rimasto`, urgent: true };
  if (hours > 0)  return { text: `${hours}h ${mins}m rimaste`, urgent: true };
  return { text: `${mins} minuti rimasti`, urgent: true };
}

// ─── Storage ──────────────────────────────────────────────────────────────────

const STORE_KEY = 'propositi_v1';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
  catch { return {}; }
}

function getCount(resId, periodKey) {
  const data = loadData();
  return data[resId]?.[periodKey] || 0;
}

function setCount(resId, periodKey, count) {
  const data = loadData();
  if (!data[resId]) data[resId] = {};
  data[resId][periodKey] = Math.max(0, count);
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

// ─── State ────────────────────────────────────────────────────────────────────

let currentFilter = 'all';

function getState(res) {
  const now       = new Date();
  const periodKey = getPeriodKey(res.frequency, now);
  const periodEnd = getPeriodEnd(res.frequency, now);
  const count     = getCount(res.id, periodKey);
  const isDone    = count >= res.target;
  return { periodKey, periodEnd, count, isDone };
}

// ─── Filter ───────────────────────────────────────────────────────────────────

function matchFilter(res) {
  const { isDone } = getState(res);
  switch (currentFilter) {
    case 'pending': return !isDone;
    case 'done':    return isDone;
    case 'daily':   return res.frequency === 'daily';
    case 'weekly':  return ['weekly', 'biweekly'].includes(res.frequency);
    case 'monthly': return res.frequency === 'monthly';
    case 'long':    return ['bimonthly', 'quarterly'].includes(res.frequency);
    default:        return true;
  }
}

// ─── Render card ─────────────────────────────────────────────────────────────

function buildCard(res) {
  const { periodKey, periodEnd, count, isDone } = getState(res);
  const pct   = Math.min(1, count / res.target);
  const timer = formatTimeLeft(periodEnd);

  const card = document.createElement('div');
  card.className = `card ${isDone ? 'is-done' : ''}`;

  const btnLabel = isDone
    ? (res.target > 1 ? `✓ Fatto! (${count}/${res.target})` : '✓ Completato!')
    : (res.target > 1 ? `Segna come fatto ✓  ·  ${count}/${res.target}` : 'Segna come fatto ✓');

  card.innerHTML = `
    <div class="card-top">
      <div class="card-emoji">${res.emoji}</div>
      <div class="card-body">
        <div class="card-freq">${FREQ_LABEL[res.frequency]}</div>
        <div class="card-text">${res.text}</div>
        ${res.note ? `<div class="card-note">${res.note}</div>` : ''}
      </div>
    </div>
    <div class="timer-row">
      <span class="timer-text ${timer.urgent ? 'urgent' : ''}">${timer.text}</span>
    </div>
    <div class="progress-row">
      <div class="progress-bar">
        <div class="progress-fill ${isDone ? 'done' : ''}" style="width:${pct*100}%"></div>
      </div>
      <div class="progress-count ${isDone ? 'done' : ''}">${count}/${res.target}</div>
    </div>
    <button class="btn-complete ${isDone ? 'done' : ''}" ${isDone && res.target===1 ? 'disabled' : ''}>${btnLabel}</button>
    ${count > 0 ? `<button class="btn-undo">↩ annulla</button>` : ''}
  `;

  card.querySelector('.btn-complete').addEventListener('click', () => {
    if (isDone && res.target === 1) return;
    setCount(res.id, periodKey, count + 1);
    if (count + 1 >= res.target) celebrate();
    render();
  });

  const undoBtn = card.querySelector('.btn-undo');
  if (undoBtn) {
    undoBtn.addEventListener('click', e => {
      e.stopPropagation();
      setCount(res.id, periodKey, count - 1);
      render();
    });
  }

  return card;
}

// ─── Render ───────────────────────────────────────────────────────────────────

const freqOrder = { daily:0, weekly:1, biweekly:2, monthly:3, bimonthly:4, quarterly:5 };

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';

  // Summary (always over all)
  const total   = RESOLUTIONS.length;
  const done    = RESOLUTIONS.filter(r => getState(r).isDone).length;
  const pending = total - done;
  document.getElementById('sumTotal').textContent   = total;
  document.getElementById('sumDone').textContent    = done;
  document.getElementById('sumPending').textContent = pending;

  const visible = RESOLUTIONS.filter(matchFilter);

  if (visible.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-emoji">🎉</div>
        <h2>Tutto completato!</h2>
        <p>Siete fantastici, continuate così ✨</p>
      </div>`;
    return;
  }

  // Sort: pending first, then by frequency
  visible.sort((a, b) => {
    const aDone = getState(a).isDone, bDone = getState(b).isDone;
    if (aDone !== bDone) return aDone ? 1 : -1;
    return freqOrder[a.frequency] - freqOrder[b.frequency];
  });

  visible.forEach(res => list.appendChild(buildCard(res)));
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
});

// ─── Celebrate ────────────────────────────────────────────────────────────────

function celebrate() {
  const burst = document.createElement('div');
  burst.className = 'celeb-burst';
  burst.textContent = '🎉';
  document.body.appendChild(burst);
  setTimeout(() => burst.remove(), 1300);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

render();
setInterval(render, 60000);
</script>
</body>
</html>
